<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Go Up (BigNum Edition)</title>
    <script src="https://cdn.jsdelivr.net/gh/Patashu/break_infinity.js/break_infinity.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        h1 {
            font-size: 48px;
        }
        button {
            font-size: 20px;
            padding: 10px;
            margin: 10px;
            cursor: pointer;
        }
        .info {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <h1 id="number">0</h1>
    <button onclick="speedUp()">Speed Up!</button>
    <button onclick="superSpeedUp()">Super Speed Up!</button>

    <div class="info">
        <p id="double">2 × number = 0</p>
        <p id="power">2 ^ number = 1</p>
        <p id="log">log₂(number) = 0</p>
    </div>

    <script>
        let number = new Decimal(0);
        let speed = new Decimal(1);
        let increaseRate = 1000; // Update interval in ms
        let lastPowerOfTwo = Decimal(0);

        const abbreviations = [
            "K", "M", "B", "T", "Qd", "Qn", "Sx", "Sp", "Oc", "No", "De",
            "Vt", "Tg", "qg", "Qg", "sg", "Sg", "Og", "Ng", "Ce"
        ];

        function formatNumber(num) {
            if (num.lessThan(1000)) return num.toFixed(2);

            let tier = Math.floor(num.log10() / 3);
            if (tier - 1 >= abbreviations.length) return num.toExponential(2);

            let scaled = num.div(Decimal.pow(10, tier * 3));
            return scaled.toFixed(2) + abbreviations[tier - 1];
        }

        function updateNumber() {
            number = number.plus(speed);
            document.getElementById("number").innerText = formatNumber(number);

            // Only scale speed on exact powers of 2 (prevent repeated scaling)
            let log2 = number.log(2);
            if (number.greaterThanOrEqualTo(16) && log2.floor().equals(log2) && !log2.equals(lastPowerOfTwo)) {
                speed = speed.times(1.2);
                lastPowerOfTwo = log2.floor();
            }

            // Update info display
            document.getElementById("double").innerText = `2 × number = ${formatNumber(number.times(2))}`;
            document.getElementById("power").innerText = `2 ^ number = ${formatNumber(Decimal.pow(2, number))}`;
            document.getElementById("log").innerText = `log₂(number) = ${number.gt(0) ? number.log(2).toFixed(2) : 0}`;
        }

        function speedUp() {
            speed = speed.times(2);
        }

        function superSpeedUp() {
            speed = speed.times(4);
        }

        setInterval(updateNumber, increaseRate);
    </script>

</body>
</html>
