<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Go Up</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        h1 {
            font-size: 48px;
        }
        button {
            font-size: 20px;
            padding: 10px;
            margin-top: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1 id="number">0</h1>
    <button onclick="speedUp()">Speed Up!</button>

    <script>
        let number = 0;
        let speed = 1; // Base speed
        let increaseRate = 100; // 1 second interval

        // Abbreviations for large numbers
        const abbreviations = ["K", "M", "B", "T", "Qd", "Qn", "Sx", "Sp", "Oc", "No", "De","UDe","DDe","TDe","QdDe","QnDe","SxDe","SpDe","OcDe","NoDe","Vt","UVt","DVt","TVt","QdVt","QnVt","SxVt","SpVt","OcVt","NoVt","Tg"];

        function formatNumber(num) {
            if (num < 1000) return num.toString(); // No abbreviation needed

            let tier = Math.floor(Math.log10(num) / 3); // Determines which abbreviation to use
            if (tier - 1 >= abbreviations.length) return num.toExponential(2); // Use scientific notation if too large

            let scaled = num / Math.pow(10, tier * 3);
            return scaled.toFixed(2) + abbreviations[tier - 1]; // Append the correct abbreviation
        }

        function updateNumber() {
            number += speed;
            document.getElementById("number").innerText = formatNumber(number);

            // Increase speed every time number reaches 16, 32, 64, 128, etc.
            if ((number & (number - 1)) === 0 && number >= 16) { 
                speed *= 10;
            }
        }

        function speedUp() {
            speed *= 10; // Clicking the button doubles the speed
        }

        setInterval(updateNumber, increaseRate);
    </script>

</body>
</html>
