<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Go Up</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        h1 {
            font-size: 48px;
        }
        button {
            font-size: 20px;
            padding: 10px;
            margin: 10px;
            cursor: pointer;
        }
        .info {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <h1 id="number">0</h1>
    <button onclick="speedUp()">Speed Up!</button>
    <button onclick="superSpeedUp()">Super Speed Up!</button>

    <div class="info">
        <p id="double">2 × number = 0</p>
        <p id="power">2 ^ number = 1</p>
        <p id="log">log₂(number) = 0</p>
    </div>

    <script>
        let number = 0;
        let speed = 1; // Base speed
        let increaseRate = 1000; // 1 second interval

        // Abbreviations for large numbers
        const abbreviations = ["K", "M", "B", "T", "Qd", "Qn", "Sx", "Sp", "Oc", "No", "De"];

        function formatNumber(num) {
            if (num < 1000) return num.toString(); // No abbreviation needed

            let tier = Math.floor(Math.log10(num) / 3); // Determines which abbreviation to use
            if (tier - 1 >= abbreviations.length) return num.toExponential(2); // Use scientific notation if too large

            let scaled = num / Math.pow(10, tier * 3);
            return scaled.toFixed(2) + abbreviations[tier - 1]; // Append the correct abbreviation
        }

        function updateNumber() {
            number += speed;
            document.getElementById("number").innerText = formatNumber(number);

            // Increase speed every time number reaches 16, 32, 64, etc.
            if ((number & (number - 1)) === 0 && number >= 16) { 
                speed *= 1.2;
            }

            // Update the info panel
            document.getElementById("double").innerText = `2 × number = ${formatNumber(number * 2)}`;
            document.getElementById("power").innerText = `2 ^ number = ${formatNumber(Math.pow(2, number))}`;
            document.getElementById("log").innerText = `log₂(number) = ${number > 0 ? Math.log2(number).toFixed(2) : 0}`;
        }

        function speedUp() {
            speed *= 10; // Clicking "Speed Up!" doubles the speed
        }

        function superSpeedUp() {
            speed *= 170; // Clicking "Super Speed Up!" quadruples the speed
        }

        setInterval(updateNumber, increaseRate);
    </script>

</body>
</html>
